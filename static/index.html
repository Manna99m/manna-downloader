<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10182b">
<title>Manna Downloader</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b1325;
  --panel:#162237;
  --panel2:#111b2d;
  --line:#273754;
  --muted:#93a1b8;
  --text:#f7f9ff;
  --purple:#8550f5;
  --purple2:#6f43df;
}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(700px 500px at 12% 17%,rgba(116,65,225,.58),transparent 70%),
    radial-gradient(650px 500px at 96% 80%,rgba(0,180,210,.25),transparent 70%),
    var(--bg);
}
.page{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:90px 0 50px}
.hero{text-align:center;margin-bottom:38px}
.logo{
  width:58px;height:58px;margin:auto;border-radius:18px;
  display:grid;place-items:center;font-size:30px;
  background:linear-gradient(145deg,#6d4cff,#1eb1d5);
  box-shadow:0 12px 35px rgba(75,77,255,.35)
}
h1{margin:15px 0 8px;font-size:42px;letter-spacing:-1.5px}
.subtitle{color:#aeb8cb;font-size:16px}
.card{
  background:rgba(22,34,55,.93);border:1px solid rgba(100,120,155,.27);
  border-radius:20px;padding:20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35)
}
.search{display:flex;gap:10px;background:#101a2b;border:1px solid #2b3955;border-radius:12px;padding:5px}
.search input{flex:1;border:0;outline:0;background:transparent;color:white;padding:0 12px;font-size:14px;min-width:0}
button{border:0;color:#fff;font-weight:750;cursor:pointer}
.analyze,.download{
  background:linear-gradient(135deg,var(--purple),#9551ff);
  border-radius:10px;padding:13px 22px;box-shadow:0 6px 20px rgba(125,70,245,.25)
}
button:disabled{opacity:.55;cursor:not-allowed}
.result{display:none;margin-top:20px;border:1px solid #2b3954;border-radius:14px;padding:20px}
.video-grid{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:center}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#0b1220}
.info h2{font-size:19px;margin:0 0 6px;line-height:1.3}
.meta{color:#9ca9bd;font-size:13px;margin-bottom:18px}
.label{font-size:12px;color:#b4bfd0;margin-bottom:7px}
select{
  width:100%;height:44px;border:1px solid #4e3a8f;border-radius:8px;
  background:#10192a;color:#fff;padding:0 12px;font-size:14px;outline:none
}
.tabs{display:flex;background:#10192a;border:1px solid #263550;border-radius:8px;margin-bottom:10px;overflow:hidden}
.tab{flex:1;padding:11px;text-align:center;background:transparent;color:#9ca8bb}
.tab.active{background:#263044;color:#fff}
.download{width:100%;margin-top:10px;height:47px}
.status{text-align:center;min-height:20px;margin-top:14px;color:#9da9bb;font-size:13px}
.status.error{color:#ff8d99}
.note{text-align:center;color:#68768e;font-size:11px;line-height:1.6;margin:18px 5px 0}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #7885a0;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:720px){
 .page{padding-top:45px}.hero{margin-bottom:25px}h1{font-size:34px}
 .card{padding:14px}.search{flex-direction:column;background:transparent;border:0;padding:0}
 .search input{height:48px;background:#101a2b;border:1px solid #2b3955;border-radius:10px}
 .analyze{width:100%;height:48px}.video-grid{grid-template-columns:1fr;gap:15px}
 .result{padding:13px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="logo">☁️</div>
    <h1>Manna Downloader</h1>
    <div class="subtitle">Download videos from supported platforms instantly.</div>
  </header>

  <section class="card">
    <div class="search">
      <input id="url" type="url" placeholder="Paste video URL here..." autocomplete="off">
      <button class="analyze" id="analyze">⌕&nbsp; Analyze</button>
    </div>

    <div class="result" id="result">
      <div class="video-grid">
        <img id="thumb" class="thumb" alt="Video thumbnail">
        <div class="info">
          <h2 id="title">Video</h2>
          <div class="meta" id="meta"></div>

          <div class="tabs">
            <button class="tab active" id="videoTab">▣ Video</button>
            <button class="tab" id="audioTab">♫ Audio</button>
          </div>

          <div class="label">Select Quality:</div>
          <select id="format"></select>
          <button class="download" id="download">⇩&nbsp; Start Download</button>
        </div>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div class="note">
      Please download only content you are authorized to download or content whose platform/rightsholder permits downloading.
      This service does not bypass DRM, paywalls, authentication, or access controls.
    </div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
let currentUrl="",mediaType="video";

function status(text,error=false,loading=false){
  $("status").innerHTML=loading?`<span class="spinner"></span>${text}`:text;
  $("status").className="status"+(error?" error":"");
}
function duration(s){
  if(!s)return "";
  s=Math.floor(Number(s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`;
}
async function analyze(){
  const url=$("url").value.trim();
  if(!url)return status("Please paste a video URL.",true);
  currentUrl=url;$("analyze").disabled=true;$("result").style.display="none";status("Analyzing video...",false,true);
  try{
    const r=await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,media_type:mediaType})});
    const d=await r.json();if(!r.ok)throw Error(d.detail||"Could not analyze this URL.");
    $("title").textContent=d.title||"Video";
    $("meta").textContent=(d.uploader?d.uploader+" • ":"")+(d.duration?duration(d.duration):"");
    $("thumb").src=d.thumbnail||"";$("thumb").style.display=d.thumbnail?"block":"none";
    fillFormats(d.formats||[]);
    $("result").style.display="block";status("Ready.");
  }catch(e){status(e.message,true)}
  finally{$("analyze").disabled=false}
}
function fillFormats(list){
  const s=$("format");s.innerHTML="";
  if(mediaType==="video"){
    const best=document.createElement("option");best.value="best";best.textContent="Best Available";s.appendChild(best);
  }
  list.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.label;s.appendChild(o)});
}
async function switchType(type){
  mediaType=type;
  $("videoTab").classList.toggle("active",type==="video");
  $("audioTab").classList.toggle("active",type==="audio");
  if(currentUrl)await analyze();
}
$("analyze").onclick=analyze;
$("videoTab").onclick=()=>switchType("video");
$("audioTab").onclick=()=>switchType("audio");
$("url").onkeydown=e=>{if(e.key==="Enter")analyze()};

$("download").onclick=async()=>{
  if(!currentUrl)return;
  $("download").disabled=true;status("Preparing your download...",false,true);
  try{
    const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:currentUrl,format_id:$("format").value,media_type:mediaType})});
    if(!r.ok){let m="Download failed.";try{m=(await r.json()).detail||m}catch{}throw Error(m)}
    status("Downloading file...",false,true);
    const blob=await r.blob();
    const cd=r.headers.get("Content-Disposition")||"";
    const match=cd.match(/filename="?([^"]+)"?/i);
    const name=match?match[1]:(mediaType==="audio"?"audio.mp3":"video.mp4");
    const a=document.createElement("a"),u=URL.createObjectURL(blob);
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);status("Download finished ✓");
  }catch(e){status(e.message,true)}
  finally{$("download").disabled=false}
};
</script>
</body>
</html>
